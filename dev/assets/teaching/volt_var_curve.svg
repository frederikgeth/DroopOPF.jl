<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="Read the Volt/VAR curve: saturation, deadband and proportional regions"><title>Read the Volt/VAR curve: saturation, deadband and proportional regions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#586b7e"/></marker></defs><rect width="100%" height="100%" fill="white"/>
