<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1040" role="img" aria-label="Parse, validate, prepare and hand off a network"><title>Parse, validate, prepare and hand off a network</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#586b7e"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="30" y="32" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#20354b">Parse, validate, prepare and hand off a network</text>
<rect x="40" y="70" width="490" height="85" rx="10" fill="#f5f9fc" stroke="#235d85" stroke-width="2"/>
<text x="285.0" y="97" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Parse source and preserve supplied state</text>
<text x="285.0" y="122" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">RAW / MATPOWER / explicit Case</text>
<path d="M285 155L285 185" fill="none" stroke="#586b7e" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="185" width="490" height="110" rx="10" fill="#f5f9fc" stroke="#235d85" stroke-width="2"/>
<text x="285.0" y="212" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Check identities, units and model coverage</text>
<text x="285.0" y="237" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Replay saved VM / VA / PG / QG when present</text>
<text x="285.0" y="262" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Record missing ratings and explicit assumptions</text>
<path d="M285 295L285 325" fill="none" stroke="#586b7e" stroke-width="2.5" marker-end="url(#arrow)"/>
<polygon points="285.0,325 510,375.0 285.0,425 60,375.0" fill="#f5f9fc" stroke="#177b70" stroke-width="2"/>
<text x="285.0" y="368.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#177b70">Inputs supported and</text>
<text x="285.0" y="392.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#177b70">study assumptions complete?</text>
<path d="M510 375L615 375" fill="none" stroke="#586b7e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="558" y="355" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#ad571d">No</text>
<rect x="625" y="325" width="340" height="110" rx="10" fill="#f5f9fc" stroke="#ad571d" stroke-width="2"/>
<text x="795.0" y="352" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#ad571d">Review source or declarations</text>
<text x="795.0" y="377" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#ad571d">Retain the supplied snapshot</text>
<text x="795.0" y="402" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#ad571d">Resolve coverage explicitly</text>
<path d="M285 425L285 470" fill="none" stroke="#586b7e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="314" y="452" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#177b70">Yes</text>
<rect x="40" y="470" width="490" height="110" rx="10" fill="#f5f9fc" stroke="#235d85" stroke-width="2"/>
<text x="285.0" y="497" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Declare the target problem</text>
<text x="285.0" y="522" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Objective, control bounds and equipment policy</text>
<text x="285.0" y="547" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Training states and frozen evaluation settings</text>
<path d="M285 580L285 615" fill="none" stroke="#586b7e" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="615" width="490" height="110" rx="10" fill="#f5f9fc" stroke="#235d85" stroke-width="2"/>
<text x="285.0" y="642" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Prepare numerical starts</text>
<text x="285.0" y="667" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Use qualified same-contract / nearby states</text>
<text x="285.0" y="692" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Or declare a fixed-control preparatory solve</text>
<path d="M285 725L285 760" fill="none" stroke="#586b7e" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="760" width="490" height="110" rx="10" fill="#f5f9fc" stroke="#235d85" stroke-width="2"/>
<text x="285.0" y="787" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Hand off to the target design model</text>
<text x="285.0" y="812" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Map identities and transfer complete primals</text>
<text x="285.0" y="837" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Check target settings, residuals and seed origin</text>
<path d="M285 870L285 905" fill="none" stroke="#586b7e" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="905" width="490" height="80" rx="10" fill="#f5f9fc" stroke="#177b70" stroke-width="2"/>
<text x="285.0" y="932" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#177b70">Run the selected design workflow</text>
<text x="285.0" y="957" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#177b70">Retain its own objectives and acceptance gates</text>
<rect x="625" y="630" width="340" height="110" rx="10" fill="#f5f9fc" stroke="#177b70" stroke-width="2"/>
<text x="795.0" y="657" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#177b70">Source data and numerical hints</text>
<text x="795.0" y="682" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#177b70">have separate provenance</text>
<text x="795.0" y="707" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#177b70">Physical limits stay explicit</text>
<text x="500" y="1020" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#20354b">Input checking and declared conversion precede any optimization.</text>
</svg>
