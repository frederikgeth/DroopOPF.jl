<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
  <title id="title">S1 evidence lanes and acceptance outcomes</title>
  <desc id="desc">Three panels distinguish the frozen direct-start scorecard, same-case witness diagnostics, and qualified AVR evidence. The frozen gate remains open while the AVR lane validates across smooth solvers and is basin-sensitive under exact complementarity.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.panel{fill:#f7f9fc;stroke:#c8d1dc;stroke-width:1.5}.title{font:700 24px system-ui,sans-serif;fill:#17212b}.head{font:700 18px system-ui,sans-serif;fill:#17212b}.text{font:14px system-ui,sans-serif;fill:#334155}.small{font:12px system-ui,sans-serif;fill:#526171}.value{font:700 17px system-ui,sans-serif;fill:#17212b}.track{fill:#e3e8ee}.pass{fill:#247a59}.diag{fill:#3274a1}.warn{fill:#c17a13}.fail{fill:#b84a4a}.arrow{stroke:#667788;stroke-width:2;fill:none;marker-end:url(#tip)}
      @media (prefers-color-scheme:dark){.bg{fill:#111827}.panel{fill:#182231;stroke:#435166}.title,.head,.value{fill:#f3f4f6}.text{fill:#d5dbe3}.small{fill:#adb8c7}.track{fill:#334155}.pass{fill:#45a77c}.diag{fill:#5596c4}.warn{fill:#d69a38}.fail{fill:#d46a6a}.arrow{stroke:#93a4b8}}
    </style>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#667788"/></marker>
  </defs>
  <rect class="bg" width="1120" height="570"/>
  <text class="title" x="40" y="44">S1 evidence must remain in separate lanes</text>
  <text class="small" x="40" y="69">v0.8.0 synthesis · physical validation and solver status are reported separately</text>

  <rect class="panel" x="40" y="95" width="320" height="390" rx="8"/>
  <text class="head" x="62" y="130">1 · Frozen direct starts</text>
  <text class="text" x="62" y="154">Adversarial synthetic-droop gate</text>
  <text class="small" x="62" y="177">Strict acceptance, 12 cells per backend</text>
  <text class="text" x="62" y="215">Ipopt</text><text class="value" x="330" y="215" text-anchor="end">8 / 12</text>
  <rect class="track" x="62" y="226" width="268" height="16" rx="3"/><rect class="pass" x="62" y="226" width="179" height="16" rx="3"/>
  <text class="text" x="62" y="276">MadNLP</text><text class="value" x="330" y="276" text-anchor="end">4 / 12</text>
  <rect class="track" x="62" y="287" width="268" height="16" rx="3"/><rect class="pass" x="62" y="287" width="89" height="16" rx="3"/>
  <text class="text" x="62" y="337">CCOpt</text><text class="value" x="330" y="337" text-anchor="end">2 / 12</text>
  <rect class="track" x="62" y="348" width="268" height="16" rx="3"/><rect class="pass" x="62" y="348" width="45" height="16" rx="3"/>
  <rect class="fail" x="62" y="397" width="12" height="12" rx="2"/><text class="text" x="84" y="408">Gate remains open</text>
  <text class="small" x="62" y="438">Relaxing droop mismatch to 1e-2 gives</text>
  <text class="small" x="62" y="457">8/12, 5/12, and 2/12 respectively.</text>

  <rect class="panel" x="400" y="95" width="320" height="390" rx="8"/>
  <text class="head" x="422" y="130">2 · Same-case witnesses</text>
  <text class="text" x="422" y="154">Failure classification, not rescoring</text>
  <text class="small" x="422" y="177">12 unresolved smooth cells</text>
  <text class="text" x="422" y="215">Strictly recovered</text><text class="value" x="690" y="215" text-anchor="end">7 / 12</text>
  <rect class="track" x="422" y="226" width="268" height="16" rx="3"/><rect class="diag" x="422" y="226" width="156" height="16" rx="3"/>
  <text class="text" x="422" y="276">Recovered only at 1e-2</text><text class="value" x="690" y="276" text-anchor="end">2 / 12</text>
  <rect class="track" x="422" y="287" width="268" height="16" rx="3"/><rect class="warn" x="422" y="287" width="45" height="16" rx="3"/>
  <text class="text" x="422" y="337">Termination gate retained</text><text class="value" x="690" y="337" text-anchor="end">3 / 12</text>
  <rect class="track" x="422" y="348" width="268" height="16" rx="3"/><rect class="fail" x="422" y="348" width="67" height="16" rx="3"/>
  <text class="small" x="422" y="401">Conclusion: feasible targets coexist with</text>
  <text class="small" x="422" y="420">basin sensitivity, narrow replay misses,</text>
  <text class="small" x="422" y="439">and termination-status failures.</text>

  <rect class="panel" x="760" y="95" width="320" height="390" rx="8"/>
  <text class="head" x="782" y="130">3 · Qualified AVR</text>
  <text class="text" x="782" y="154">Separate physically selected M8 lane</text>
  <text class="small" x="782" y="177">12 staged cells per backend</text>
  <text class="text" x="782" y="215">Ipopt</text><text class="value" x="1050" y="215" text-anchor="end">12 / 12</text>
  <rect class="track" x="782" y="226" width="268" height="16" rx="3"/><rect class="pass" x="782" y="226" width="268" height="16" rx="3"/>
  <text class="text" x="782" y="276">MadNLP</text><text class="value" x="1050" y="276" text-anchor="end">12 / 12</text>
  <rect class="track" x="782" y="287" width="268" height="16" rx="3"/><rect class="pass" x="782" y="287" width="268" height="16" rx="3"/>
  <text class="text" x="782" y="337">CCOpt direct physical</text><text class="value" x="1050" y="337" text-anchor="end">11 / 12</text>
  <rect class="track" x="782" y="348" width="268" height="16" rx="3"/><rect class="pass" x="782" y="348" width="246" height="16" rx="3"/>
  <path class="arrow" d="M804 402 C850 388, 920 388, 972 402"/>
  <text class="small" x="782" y="432">Full smooth witness recovers exact k3:</text>
  <text class="small" x="782" y="451">valid, ALMOST_LOCALLY_SOLVED, 2.484e-8</text>

  <line x1="40" y1="515" x2="1080" y2="515" stroke="#9aa8b8" stroke-width="1"/>
  <rect class="pass" x="40" y="536" width="11" height="11" rx="2"/><text class="small" x="59" y="546">Physical pass</text>
  <rect class="diag" x="183" y="536" width="11" height="11" rx="2"/><text class="small" x="202" y="546">Diagnostic recovery</text>
  <rect class="warn" x="366" y="536" width="11" height="11" rx="2"/><text class="small" x="385" y="546">Relaxed-only</text>
  <rect class="fail" x="494" y="536" width="11" height="11" rx="2"/><text class="small" x="513" y="546">Gate failure</text>
  <text class="small" x="1080" y="546" text-anchor="end">Different lanes must not be pooled.</text>
</svg>
