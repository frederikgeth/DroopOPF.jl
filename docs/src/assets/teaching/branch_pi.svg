<text x="420" y="292" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#20354b">j bᶜʰ / 2</text>
<text x="760" y="292" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#20354b">j bᶜʰ / 2</text>
<text x="410" y="103" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#20354b">Internal voltage U_f = V_f / a</text>
<path d="M90 189L170 189" fill="none" stroke="#ad571d" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="137" y="215" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#ad571d">I_f</text>
<path d="M900 189L820 189" fill="none" stroke="#ad571d" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="861" y="215" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#ad571d">I_t</text>
<text x="500" y="335" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#20354b">Both terminal currents point into the branch; S_f + S_t is its net complex absorption.</text>
<text x="500" y="360" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#20354b">τ: positive tap ratio; φ: phase shift (rad); j² = −1; bᶜʰ: total charging susceptance.</text>
</svg>
