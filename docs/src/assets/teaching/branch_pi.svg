<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="One branch: from-side tap, series impedance and charging"><title>One branch: from-side tap, series impedance and charging</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#586b7e"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="30" y="32" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#20354b">One branch: from-side tap, series impedance and charging</text>
<path d="M75 95L75 215" fill="none" stroke="#235d85" stroke-width="2.5"/>
<path d="M920 95L920 215" fill="none" stroke="#235d85" stroke-width="2.5"/>
