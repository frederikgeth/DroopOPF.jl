<text x="920" y="75" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#20354b">To bus t</text>
<path d="M75 150L195 150" fill="none" stroke="#586b7e" stroke-width="2.5"/>
<rect x="195" y="120" width="155" height="60" rx="10" fill="#f5f9fc" stroke="#235d85" stroke-width="2"/>
<text x="272.5" y="147" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Tap a = τ exp(jφ)</text>
<path d="M350 150L480 150" fill="none" stroke="#586b7e" stroke-width="2.5"/>
<rect x="480" y="125" width="200" height="50" rx="10" fill="#f5f9fc" stroke="#235d85" stroke-width="2"/>
<text x="580.0" y="152" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Series z = r + jx</text>
<path d="M680 150L920 150" fill="none" stroke="#586b7e" stroke-width="2.5"/>
<path d="M420 150L420 226" fill="none" stroke="#586b7e" stroke-width="2.5"/>
