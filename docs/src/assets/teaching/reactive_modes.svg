<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365" role="img" aria-label="Reactive mode chooses the equation that accompanies AC balance"><title>Reactive mode chooses the equation that accompanies AC balance</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#586b7e"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="30" y="32" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#20354b">Reactive mode chooses the equation that accompanies AC balance</text>
<rect x="20" y="80" width="230" height="120" rx="10" fill="#f5f9fc" stroke="#235d85" stroke-width="2"/>
<text x="135.0" y="107" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">FreeQ</text>
<text x="135.0" y="132" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Optimizer chooses Q</text>
<text x="135.0" y="157" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">within its limits</text>
<rect x="267" y="80" width="230" height="120" rx="10" fill="#f5f9fc" stroke="#235d85" stroke-width="2"/>
<text x="382.0" y="107" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">FixedQ</text>
<text x="382.0" y="132" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Q = supplied schedule</text>
<text x="382.0" y="157" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">while available</text>
<rect x="514" y="80" width="230" height="120" rx="10" fill="#f5f9fc" stroke="#235d85" stroke-width="2"/>
<text x="629.0" y="107" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">AVR</text>
<text x="629.0" y="132" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Hold measured voltage</text>
<text x="629.0" y="157" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">until Q reaches a limit</text>
<rect x="761" y="80" width="230" height="120" rx="10" fill="#f5f9fc" stroke="#235d85" stroke-width="2"/>
<text x="876.0" y="107" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">VoltVarDroop</text>
<text x="876.0" y="132" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Follow supplied Q(v)</text>
<text x="876.0" y="157" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">with deadband and limits</text>
<text x="500" y="242" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#20354b">The bus voltage and reactive output are solved together with the network.</text>
<text x="500" y="277" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#20354b">An angle-reference bus does not create unlimited active or reactive capability.</text>
<text x="500" y="315" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#20354b">AVR: automatic voltage regulation. Q: reactive output. v: measured voltage magnitude.</text>
</svg>
