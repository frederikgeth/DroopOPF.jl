<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" role="img" aria-label="Review qualified candidates and choose a design"><title>Review qualified candidates and choose a design</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#586b7e"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="30" y="32" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#20354b">Review qualified candidates and choose a design</text>
<polygon points="295.0,80 545,132.5 295.0,185 45,132.5" fill="#f5f9fc" stroke="#177b70" stroke-width="2"/>
<text x="295.0" y="125.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#177b70">Native solver convergence</text>
<text x="295.0" y="149.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#177b70">and independent replay pass?</text>
<path d="M545 132L625 132" fill="none" stroke="#586b7e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="585" y="113" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#ad571d">No</text>
<rect x="640" y="75" width="320" height="115" rx="10" fill="#f5f9fc" stroke="#ad571d" stroke-width="2"/>
<text x="800.0" y="102" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#ad571d">Retain unresolved / failed result</text>
<text x="800.0" y="127" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#ad571d">Inspect coverage and residuals</text>
<text x="800.0" y="152" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#ad571d">Retry a qualified mapped start</text>
<path d="M295 185L295 230" fill="none" stroke="#586b7e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="325" y="212" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#177b70">Yes</text>
<rect x="45" y="230" width="500" height="110" rx="10" fill="#f5f9fc" stroke="#235d85" stroke-width="2"/>
<text x="295.0" y="257" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Compare matched candidates</text>
<text x="295.0" y="282" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Same source, limits, controls and state coverage</text>
<text x="295.0" y="307" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Same objective and numerical budgets</text>
<path d="M295 340L295 375" fill="none" stroke="#586b7e" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="45" y="375" width="500" height="110" rx="10" fill="#f5f9fc" stroke="#235d85" stroke-width="2"/>
<text x="295.0" y="402" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Review physical and numerical performance</text>
<text x="295.0" y="427" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Losses, reserve, voltage and thermal margins</text>
<text x="295.0" y="452" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Iterations, runtime, memory and retries</text>
<path d="M295 485L295 525" fill="none" stroke="#586b7e" stroke-width="2.5" marker-end="url(#arrow)"/>
<polygon points="295.0,525 545,577.5 295.0,630 45,577.5" fill="#f5f9fc" stroke="#177b70" stroke-width="2"/>
<text x="295.0" y="570.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#177b70">Meets declared requirements</text>
<text x="295.0" y="594.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#177b70">and objective priorities?</text>
<path d="M545 577L625 577" fill="none" stroke="#586b7e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="585" y="559" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#ad571d">No</text>
<rect x="640" y="520" width="320" height="115" rx="10" fill="#f5f9fc" stroke="#ad571d" stroke-width="2"/>
<text x="800.0" y="547" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#ad571d">Revisit declared choices</text>
<text x="800.0" y="572" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#ad571d">Try a matched solver or start</text>
<text x="800.0" y="597" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#ad571d">Record every changed assumption</text>
<path d="M295 630L295 675" fill="none" stroke="#586b7e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="325" y="656" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#177b70">Yes</text>
<rect x="45" y="675" width="500" height="110" rx="10" fill="#f5f9fc" stroke="#235d85" stroke-width="2"/>
<text x="295.0" y="702" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Freeze the selected controller and settings</text>
<text x="295.0" y="727" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Replay held-out demands and schedule interiors</text>
<text x="295.0" y="752" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#235d85">Check declared outages / periods when required</text>
<path d="M295 785L295 825" fill="none" stroke="#586b7e" stroke-width="2.5" marker-end="url(#arrow)"/>
<polygon points="295.0,825 545,877.5 295.0,930 45,877.5" fill="#f5f9fc" stroke="#177b70" stroke-width="2"/>
<text x="295.0" y="870.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#177b70">Required evaluation coverage</text>
<text x="295.0" y="894.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#177b70">passes original-limit replay?</text>
<path d="M545 877L625 877" fill="none" stroke="#586b7e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="585" y="859" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#ad571d">No</text>
<rect x="640" y="830" width="320" height="110" rx="10" fill="#f5f9fc" stroke="#ad571d" stroke-width="2"/>
<text x="800.0" y="857" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#ad571d">Retain the coverage gap</text>
<text x="800.0" y="882" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#ad571d">Add training states if authorized</text>
<text x="800.0" y="907" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#ad571d">Re-evaluate the common design</text>
<path d="M295 930L295 965" fill="none" stroke="#586b7e" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="45" y="965" width="500" height="65" rx="10" fill="#f5f9fc" stroke="#177b70" stroke-width="2"/>
<text x="295.0" y="992" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#177b70">Select and report the verified design scope</text>
</svg>
