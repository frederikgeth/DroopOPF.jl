<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc">
<title id="title">Voltage-source GFM equivalent circuit</title><desc id="desc">Virtual source E connects through virtual impedance Zv to converter voltage U, then through physical impedance Zp to terminal V. Current flows right. Terminal powers feed the droop controller. Only physical resistance produces connection losses.</desc>
<rect width="1000" height="240" fill="#f8fafc" rx="12"/>
<g font-family="sans-serif" fill="#0f172a" text-anchor="middle">
<text x="500" y="30" font-size="20">Internal command and physical connection</text>
<g stroke="#334155" stroke-width="3" fill="none"><circle cx="70" cy="100" r="28"/><path d="M98 100H175 M295 100H495 M615 100H890"/><rect x="175" y="77" width="120" height="46"/><rect x="495" y="77" width="120" height="46"/><path d="M395 90v20 M890 65v70"/></g>
<text x="70" y="107" font-size="20">E</text><text x="235" y="106" font-size="18">Zᵥ</text><text x="555" y="106" font-size="18">Zₚ</text>
<text x="395" y="72" font-size="19">U</text><text x="890" y="55" font-size="19">V</text>
<text x="235" y="153" font-size="16">Virtual impedance</text><text x="555" y="153" font-size="16">Physical impedance</text><text x="890" y="158" font-size="16">Network terminal</text>
<path d="M690 75h90l-10 -6m10 6l-10 6" stroke="#0f766e" stroke-width="2" fill="none"/><text x="735" y="63" font-size="17">I</text>
<text x="250" y="195" font-size="16">Voltage command adjustment</text><text x="640" y="195" font-size="16">Physical loss: Rₚ |I|²</text>
<text x="500" y="224" font-size="15">Terminal P and Q feed frequency and internal-voltage droop. Current bounds define the unsaturated envelope.</text>
</g></svg>
