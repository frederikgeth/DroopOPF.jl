<text x="405" y="110">AC collection</text>
<text x="267" y="42">Terminal</text><text x="628" y="42">POI</text>
<text x="282" y="173">vₜ, P, Q</text><text x="624" y="173">vPOI</text><text x="813" y="89">Grid</text>
