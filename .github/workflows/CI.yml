name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check release boundaries and documentation links
        run: |
          python3 -m unittest discover -s tools/release -p 'test_public_boundary.py'
          python3 tools/release/check_package.py
      - name: Check library ownership
        run: |
          python3 tools/check_boundaries.py
          python3 -m unittest discover -s tools -p test_boundaries.py
      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - name: Cache Julia artifacts and packages
        uses: julia-actions/cache@v2
      - name: Instantiate project
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run package tests
        env:
          JULIA_NUM_THREADS: 2
          OPENBLAS_NUM_THREADS: 1
        run: julia --project=. -e 'using Pkg; Pkg.test()'
      - name: Independent smoke example
        run: julia --project=. examples/release_smoke.jl

  powerio:
    name: PowerIO integration Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.12']
    env:
      JULIA_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
      DROOPOPF_POWERIO_TEST_PROFILE: released
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Instantiate separate PowerIO environment
        run: julia --project=test/powerio -e 'using Pkg; Pkg.develop(path="."); Pkg.add(PackageSpec(name="PowerIO", version="0.11.7")); Pkg.instantiate()'
      - name: Run PowerIO import and export integration tests
        run: julia --project=test/powerio test/powerio/runtests.jl

  powerio-corrected:
    name: Upstream PowerIO 0.11.9 validation Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.12']
    env:
      JULIA_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
      DROOPOPF_POWERIO_TEST_PROFILE: corrected
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned upstream validation source
        uses: actions/checkout@v4
        with:
          repository: eigenergy/powerio
          ref: e8472dd0d3b80af8642b3232ea41b4e0768f44c1
          path: _powerio_validation_source
          persist-credentials: false
      - name: Build validation library
        working-directory: _powerio_validation_source
        run: cargo build --locked -p powerio-capi
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Instantiate separate PowerIO environment
        run: julia --project=test/powerio -e 'using Pkg; Pkg.develop(path="."); Pkg.add(PackageSpec(name="PowerIO", version="0.11.7")); Pkg.instantiate()'
      - name: Require corrected transformer and frequency success paths
        run: POWERIO_CAPI="$PWD/_powerio_validation_source/target/debug/libpowerio_capi.so" julia --project=test/powerio test/powerio/runtests.jl

  powermodels:
    name: PowerModels staged design Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.12']
    env:
      JULIA_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Instantiate optional PowerModels environment
        run: julia --project=test/powermodels -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Check prepared-network design and persistence
        run: julia --project=test/powermodels test/powermodels/runtests.jl
