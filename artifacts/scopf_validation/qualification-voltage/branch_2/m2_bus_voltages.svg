<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620">
<title>M2 bus voltages by scenario</title><desc>Bus voltage magnitudes across the base case and contingencies, with bus limits.</desc>
