<text x="80" y="332" text-anchor="end" font-family="sans-serif" font-size="12">0.997</text>
<line x1="90" y1="238" x2="880" y2="238" stroke="#e5e7eb"/>
<text x="80" y="242" text-anchor="end" font-family="sans-serif" font-size="12">1.003</text>
