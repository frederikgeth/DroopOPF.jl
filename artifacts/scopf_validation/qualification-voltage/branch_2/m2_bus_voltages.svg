<rect x="90" y="58" width="790" height="450" fill="none" stroke="#374151"/>
<text x="18" y="283.0" transform="rotate(-90 18 283.0)" text-anchor="middle" font-family="sans-serif" font-size="14">Voltage magnitude (pu)</text>
<text x="90" y="533" text-anchor="middle" font-family="sans-serif" font-size="12">base</text>
<text x="880" y="533" text-anchor="middle" font-family="sans-serif" font-size="12">branch_2</text>
<polyline points="86.5,148.0001 876.5,132.9999" fill="none" stroke="#2563eb" stroke-width="2.5"/>
