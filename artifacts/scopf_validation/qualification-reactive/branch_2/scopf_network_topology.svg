<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650">
<title>Declared AC network topology for SCOPF</title><desc>Base network equipment, limits, loads, and generator bounds. This is not a solved operating-state diagram.</desc>
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:22px;font-weight:bold}.sub{font-size:12px;fill:#475569}.bus{fill:#fff;stroke:#1d4ed8;stroke-width:2}.ref{fill:#dbeafe;stroke:#0f3b91;stroke-width:3}.line{stroke:#2563eb;stroke-width:3}.transformer{stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 5}.edge{font-size:10px}.detail{font-size:10px;fill:#475569}.head{font-size:15px;font-weight:bold}.table{font-size:10px}</style><rect width="100%" height="100%" fill="white"/>
<text class="title" x="30" y="34">Declared AC network: parallel-reactive</text><text class="sub" x="30" y="55">Base equipment and constraints. Scenario-specific outages are shown in the declared-inputs and operating-state plots.</text>
<text class="head" x="30" y="91">Topology</text><line class="line" x1="30" y1="110" x2="68" y2="110"/><text class="sub" x="74" y="114">line</text><line class="transformer" x1="135" y1="110" x2="173" y2="110"/><text class="sub" x="179" y="114">transformer</text><circle class="ref" cx="293" cy="110" r="9"/><text class="sub" x="309" y="114">reference bus</text>
<line class="line" x1="370" y1="95" x2="370" y2="445"/><text class="edge" x="374" y="266">B1 line lim=2</text>
<line class="transformer" x1="370" y1="95" x2="370" y2="445"/><text class="edge" x="374" y="266">B2 transformer lim=2</text>
<circle class="ref" cx="370" cy="95" r="18"/><text text-anchor="middle" font-size="11" font-weight="bold" x="370" y="99">Bus 1</text>
<text class="detail" text-anchor="middle" x="370" y="126">V [0.9, 1.1]</text>
<text class="detail" text-anchor="middle" x="370" y="138">G1: P [0, 0.8], Q [-1, 0.2]</text>
<text class="detail" text-anchor="middle" x="370" y="150">G2: P [0, 0.8], Q [-1, 0.2]</text>
<circle class="bus" cx="370" cy="445" r="18"/><text text-anchor="middle" font-size="11" font-weight="bold" x="370" y="449">Bus 2</text>
<text class="detail" text-anchor="middle" x="370" y="476">V [0.9, 1.1]</text>
<text class="detail" text-anchor="middle" x="370" y="488">Load: P=0.3, Q=0.3</text>
<text class="head" x="30" y="520">Branch and transformer inventory</text><rect x="30" y="532" width="1180" height="20" fill="#1e3a8a"/><text fill="white" font-size="11" font-family="Arial" x="40" y="546">ID / kind</text><text fill="white" font-size="11" font-family="Arial" x="190" y="546">endpoints</text><text fill="white" font-size="11" font-family="Arial" x="330" y="546">r</text><text fill="white" font-size="11" font-family="Arial" x="420" y="546">x</text><text fill="white" font-size="11" font-family="Arial" x="510" y="546">tap</text><text fill="white" font-size="11" font-family="Arial" x="610" y="546">shift</text><text fill="white" font-size="11" font-family="Arial" x="710" y="546">thermal limit</text>
<rect x="30" y="554" width="1180" height="22" fill="#f8fafc"/><text class="table" x="40" y="568">B1 / line</text><text class="table" x="190" y="568">1 → 2</text><text class="table" x="330" y="568">0.02</text><text class="table" x="420" y="568">0.15</text><text class="table" x="510" y="568">1</text><text class="table" x="610" y="568">0</text><text class="table" x="710" y="568">2</text>
<rect x="30" y="576" width="1180" height="22" fill="#e2e8f0"/><text class="table" x="40" y="590">B2 / transformer</text><text class="table" x="190" y="590">1 → 2</text><text class="table" x="330" y="590">0.02</text><text class="table" x="420" y="590">0.15</text><text class="table" x="510" y="590">1</text><text class="table" x="610" y="590">0</text><text class="table" x="710" y="590">2</text>
</svg>
