<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="310" viewBox="0 0 1250 310">
<title>Island policy and retained-component validation</title><desc>Discarded components are not balanced. Retained island uses free OPF redispatch, not connected preventive participation.</desc>
